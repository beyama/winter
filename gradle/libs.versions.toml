[versions]
agp = "9.4.1"
kotlin = "2.4.21"
mavenPublish = "0.37.0"
dokka = "2.2.0"
# Compatibility floor for consumers: language/API version and the kotlin-stdlib version
# that is published as dependency. Consumers need at least Kotlin 1.9 to read it.
kotlinConsumerApi = "2.0"
kotlinConsumerStdlib = "2.0.21"
assertk = "0.28.1"
kotest = "6.2.6"
# Only used by the native targets (reentrant lock).
atomicfu = "0.33.0"
mockito = "5.24.0"
mockitoKotlin = "6.4.0"
junit = "4.13.2"
# JUnit 5 is part of the public API of winter-junit5, don't move to 6 without need.
junit5 = "5.14.4"
# AndroidX versions end up in consumers' dependency graphs, only bump them deliberately.
lifecycle = "2.7.0"
activity = "1.8.2"
androidxTestJunit = "1.1.5"
espressoCore = "3.5.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-testing = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycle" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
