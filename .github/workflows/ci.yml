name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM, JS & Wasm tests, Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: >
          ./gradlew
          :winter:jvmTest
          :winter-delegate:jvmTest
          :winter-junit4:test
          :winter-junit5:test

      # Node.js is downloaded by the Kotlin Gradle plugin.
      - name: Run JS and Wasm tests
        run: >
          ./gradlew
          :winter:jsTest
          :winter-delegate:jsTest
          :winter:wasmJsTest
          :winter-delegate:wasmJsTest

      # Uses the Android SDK preinstalled on the runner.
      - name: Build Android module
        run: >
          ./gradlew
          :winter-androidx:assembleDebug
          :winter-androidx:compileDebugAndroidTestKotlin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  apple:
    name: Apple tests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native compiler and its dependencies (LLVM etc.).
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # iosX64 can't run on the arm64 runner and is only compiled.
      - name: Run macOS and iOS simulator tests
        run: >
          ./gradlew
          :winter:macosArm64Test
          :winter-delegate:macosArm64Test
          :winter:iosSimulatorArm64Test
          :winter-delegate:iosSimulatorArm64Test
          :winter:compileKotlinIosArm64
          :winter-delegate:compileKotlinIosArm64
          :winter:compileKotlinIosX64
          :winter-delegate:compileKotlinIosX64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
